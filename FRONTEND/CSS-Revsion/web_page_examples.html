<!Doctype html>
<html>
    <head> 
        <title>Practice web pages</title>
        <style>
            .input{
                border-radius:5px;
                height: 24px;
                padding-left: 29px;
                border-color:red;
                transition:cursor 0.5;
            }
            .input:hover{
                cursor: pointer;
            }
            .goog{
                text-align: center;
                height: 30px;
                width:300px;
                border-radius:50px;
                border:none;
                box-shadow: 2px 2px 2px rgba(0, 0,0,0.3);
            }
            .link{
                border-radius: 5px;
                width: 300px;
                height: 20px;
            }
            .p{
                font-family:Arial;
            }
            .lin{
                text-align: center;
                background-color:rgb(51, 84, 247);
                color: white;
                border:none;
                height: 30px;
                width: 180px;
                border-radius: 50px;
                
                font-size: 15px;
            }
            .twit{
                width: 50px;
                vertical-align: middle;
            }
            .spid{
                border:none;
                height: 50px;
                width: 500px;
                padding-left: 20px;
                font-size: 20px;
                color: rgba(77, 81, 81, 0.945);
                
            }
            .tw{
                color: white;
                background-color: rgb(5, 188, 250);
                font-size: 20px;
                width: 90px;
                height: 40px;
                border-radius: 20px;
                border:none;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <p> Text Boxes</p>
        <input type="text" placeholder="Search" class="input">
        <p>with a shadow, and no border input box </p>
        <input type="text" class="goog" placeholder="Search Google or type a URL">
        <p>Linkrdln sign-up</p>
        <h3>Email</h3>
        <input type="email" class="link">
        <p class="a">By clicking Agree & Join, you agree to the Privacy Policy.</p>
        <button class="lin">Agree & Join</button>
        <h3>Twitter text box</h3>
        
        <img src="Assets/spidey.jpg" name="Spiderman" class="twit">
        <input type="text" placeholder="What's hapening ?" class="spid">
            <button class="tw">Tweet</button>
    
    </body>
</html>
