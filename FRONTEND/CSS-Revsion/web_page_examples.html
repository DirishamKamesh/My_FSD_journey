<!Doctype html>
<html>
    <head> 
        <title>Practice web pages</title>
        <style>
            .input{
                border-radius:5px;
                height: 24px;
                padding-left: 29px;
                border-color:red;
                transition:cursor 0.5;
            }
            .input:hover{
                cursor: pointer;
            }
            .goog{
                text-align: center;
                height: 30px;
                width:300px;
                border-radius:50px;
                border:none;
                box-shadow: 2px 2px 2px rgba(0, 0,0,0.3);
            }
            .link{
                border-radius: 5px;
                width: 300px;
                height: 20px;
            }
            .p{
                font-family:Arial;
            }
            .lin{
                text-align: center;
                background-color:rgb(51, 84, 247);
                color: white;
                border:none;
                height: 30px;
                width: 180px;
                border-radius: 50px;
                
                font-size: 15px;
            }
            .twit{
                width: 50px;
                vertical-align: middle;
            }
            .spid{
                border:none;
                height: 50px;
                width: 500px;
                padding-left: 20px;
                font-size: 20px;
                color: rgba(77, 81, 81, 0.945);
                
            }
            .tw{
                color: white;
                background-color: rgb(5, 188, 250);
                font-size: 20px;
                width: 90px;
                height: 40px;
                border-radius: 20px;
                border:none;
                font-weight: bold;
                transition: color 0.5s,background-color 0.5s,cursor 0.5s;
            }
            .tw:hover{
                color:rgb(5, 188, 250);
                background-color: white;
                cursor: pointer;
            }
            .fir{
                height: 40px;
                width: 150px;
                border-radius:8px;
                padding-left: 15px;
                margin-bottom: 15px;
                margin-right:4px;
                border-width: 0.5px;
                
                font-size: 17px;
            }
            .sec{
                  height: 40px;
                width: 150px;
                border-radius:8px;
                padding-left: 15px;
                border-width: 0.5px;
               font-size: 17px;
            }
            .ema{
                height: 40px;
                width: 329px;
                border-radius:8px;
                padding-left: 15px;
                border-width: 0.5px;
                font-size: 17px;
            }
            .si{
                margin-top: 18px;
                height: 50px;
                width: 340px;
                border:none;
                color:white;
                background-color:rgb(31, 136, 249) ;
                border-radius:13px;
                font-size:19px;
                font-weight: 600;
            }
            .a{
                font-family: monospace;
                font-size: 60px;
                margin-bottom: 25px;
            }
            .pick{
                width: 500px;
                height: 50px;
                border-radius:5px;
                border:none;
                padding-left: 30px;
                font-size:20px;
                margin-bottom: 10px;
                background-color: rgb(234, 234, 239);
            }
            .dest{
                width: 500px;
                height: 50px;
                border-radius:5px;
                padding-left: 30px;
                font-size:20px;
                border:none;
                background-color: rgb(234, 234, 239);
            }
            .re{
                margin-top: 30px;
                border:none;
                font-size: 20px;
                height: 50px;
                width: 160px;
                margin-right:10px;
                background-color: black;
                color: white;
            }
            .se{
                 margin-top: 30px;
                border:none;
                font-size: 20px;
                height: 50px;
                width: 160px;
                color: black;
                background-color:rgb(234, 234, 239) ;
            }
            .te{
                padding-left: 10px;
                margin-left:20px;
                border:rgb(185, 181, 181);
                border-radius: 10px;
                width: 700px;
                margin-bottom: 20px;
                transition:box-shadow 1;
            }
            .te:hover{
                
                box-shadow: 10px 10px 15px rgba(0, 0,0,0.5);
            }
            .spid:active{
                border:none;
            }
        </style>
    </head>
    <body>
        <p> Text Boxes</p>
        <input type="text" placeholder="Search" class="input">
        <p>with a shadow, and no border input box </p>
        <input type="text" class="goog" placeholder="Search Google or type a URL">
        <p>Linkrdln sign-up</p>
        <h3>Email</h3>
        <input type="email" class="link">
        <p class="a">By clicking Agree & Join, you agree to the Privacy Policy.</p>
        <button class="lin">Agree & Join</button>
        <h3>Twitter text box :-</h3>
        <div class=" te">
            <img src="Assets/spidey.jpg" name="Spiderman" class="twit">
        <input type="text" placeholder="What's hapening ?" class="spid">
            <button class="tw">Tweet</button>
        </div>
        
            <hr><hr>
            <h3> Sign-up Form :-</h3>
        <input type="text" placeholder="First name" class="fir">
        <input type="text" placeholder="Second name" class="sec"><br>
        <input type="email" placeholder="Email" class="ema"><br>
        <button class="si">Sign Up</button>
        <hr><hr><h3>Uber request-a-ride form :-</h3>
        <p class="a">Request a ride now </p>
        <input type="text" class="pick" placeholder="Enter pickup location"><br>
        <input type="text" class="dest" placeholder="Enter destination"><br>
        <button class="re"> Request now</button>
        <button class="se">Shedule for later</button>
    </body>
</html>
